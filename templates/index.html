<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoURL: Shorten your URLs!</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind dark mode via class strategy
      tailwind.config = {
        darkMode: "class",
      };

      // Toggle dark mode manually
      function toggleDarkMode() {
        document.documentElement.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          document.documentElement.classList.contains("dark") ? "dark" : "light"
        );
      }

      // Apply saved theme on page load
      window.onload = () => {
        const saved = localStorage.getItem("theme");
        if (saved === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      };
    </script>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col items-center justify-center p-4"
  >
    <!-- Header -->
    <header
      class="absolute top-0 w-full p-4 flex justify-between items-center bg-white dark:bg-gray-800 shadow"
    >
      <h1 class="text-xl font-bold tracking-wide">GoURL</h1>
      <button
        onclick="toggleDarkMode()"
        class="text-sm border px-3 py-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700"
      >
        Toggle Theme
      </button>
    </header>

    <!-- Main Box -->
    <main
      class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md mt-20"
    >
      <h2 class="text-2xl font-bold mb-4 text-center">Shorten Your URLs</h2>
      <form
        hx-post="/shorten"
        hx-target="#result"
        hx-swap="innerHTML"
        class="flex flex-col"
      >
        <input
          type="url"
          name="url"
          placeholder="Enter URL to shorten"
          class="w-full p-2 border rounded mb-4 dark:bg-gray-900 dark:border-gray-600"
          required
        />
        <button
          type="submit"
          class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600"
        >
          Shorten URL
        </button>
      </form>
      <div id="result" class="mt-4 text-center"></div>
    </main>
  </body>
</html>
