<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoURL · Shorten your URLs</title>

    <!-- Tailwind (only once) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <script>
      tailwind.config = { darkMode: "class" };

      function toggleDark() {
        document.documentElement.classList.toggle("dark");
        localStorage.theme = document.documentElement.classList.contains("dark")
          ? "dark"
          : "light";
      }

      /* Load saved theme */
      window.onload = () => {
        if (localStorage.theme === "dark")
          document.documentElement.classList.add("dark");
      };

      function toggleAll() {
        const list = document.getElementById("all-urls");
        const btn = document.getElementById("all-btn");

        /* first click → fetch list */
        if (list.dataset.loaded === "false") {
          fetch("/all")
            .then((r) => {
              if (!r.ok) throw new Error(r.statusText);
              return r.text();
            })
            .then((html) => {
              list.innerHTML = html; // inject <li>…</li>
              htmx.process(list);
              list.dataset.loaded = "true"; // mark as cached
              list.classList.remove("hidden"); // make it visible
              btn.textContent = "Hide All Shortened URLs";
            })
            .catch((err) => console.error("Fetch /all failed:", err));
          return; // <<< done for first click
        }

        /* subsequent clicks → just toggle */
        list.classList.toggle("hidden");
        btn.textContent = list.classList.contains("hidden")
          ? "Show All Shortened URLs"
          : "Hide All Shortened URLs";
      }
    </script>
  </head>

  <body
    class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col items-center p-4"
  >
    <!-- Header -->
    <header
      class="fixed top-0 w-full flex justify-between items-center p-4 bg-white dark:bg-gray-800 shadow"
    >
      <h1 class="text-xl font-bold">GoURL</h1>
      <button
        onclick="toggleDark()"
        class="text-sm border px-3 py-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700"
      >
        Toggle Theme
      </button>
    </header>

    <!-- Main -->
    <main
      class="w-full max-w-md mt-24 bg-white dark:bg-gray-800 p-8 rounded-lg shadow"
    >
      <h2 class="text-2xl font-bold mb-4 text-center">Shorten Your URLs</h2>

      <!-- Shorten form -->
      <form
        hx-post="/shorten"
        hx-target="#result"
        hx-swap="innerHTML"
        class="space-y-4"
      >
        <input
          type="url"
          name="url"
          placeholder="Enter URL"
          required
          class="w-full p-2 border rounded dark:bg-gray-900 dark:border-gray-600"
        />
        <button
          class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
        >
          Shorten
        </button>
      </form>

      <!-- Result placeholder -->
      <div id="result" class="mt-4 text-center"></div>

      <!-- Show / Hide list -->
      <!-- Show / Hide list -->
      <div class="flex justify-center mt-4">
        <button
          id="all-btn"
          onclick="toggleAll()"
          class="bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded hover:bg-gray-300 dark:hover:bg-gray-600"
        >
          Show All Shortened URLs
        </button>
      </div>

      <ul
        id="all-urls"
        data-loaded="false"
        class="hidden mt-4 text-sm font-mono divide-y divide-gray-300 dark:divide-gray-600"
      ></ul>
    </main>
  </body>
</html>
